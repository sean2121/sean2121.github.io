<!doctype html>
<html lang="{{ site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines | escape }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
{% feed_meta %}
</head>
<body>
<main>

  <header class="site{% if page.home %} home{% endif %}">
    <p class="logo"><a href="{{ '/' | relative_url }}">CITRINE</a></p>
    <nav class="site" aria-label="サイト内">
      <a href="{{ '/#services' | relative_url }}">SERVICES</a>
      <a href="{{ '/#company' | relative_url }}">COMPANY</a>
      {%- comment %} 記事が1本もないうちは ARTICLES を出さない {% endcomment %}
      {%- if site.posts.size > 0 %}
      <a href="{{ '/articles/' | relative_url }}"{% if page.url contains '/articles/' %} aria-current="page"{% endif %}>ARTICLES</a>
      {%- endif %}
    </nav>
  </header>

{{ content }}

  <footer class="site">&copy; CITRINE Inc.</footer>

</main>
</body>
</html>
